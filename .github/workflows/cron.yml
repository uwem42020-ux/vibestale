name: Frequent News Fetch

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: News ingest
        run: |
          curl -fsSL -X GET "https://vibestale.com/api/cron/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: News AI analysis
        run: |
          curl -fsSL -X GET "https://vibestale.com/api/cron/ai-analysis" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Entertainment ingest
        run: |
          curl -fsSL -X GET "https://vibestale.com/api/cron/entertainment-ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
