name: Frequent News and Music Fetch

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:         # allows manual trigger

jobs:
  news-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call news ingest endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/ingest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  news-ai-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Call news AI analysis endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/ai-analysis \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  music-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call music ingest endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/music-ingest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  music-ai-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Call music AI analysis endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/music-analysis \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  youtube-search:
    runs-on: ubuntu-latest
    steps:
      - name: Call YouTube search endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/youtube-search \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"