name: Frequent News Fetch

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:         # allows manual trigger

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/ingest \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  ai-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Call ai-analysis endpoint
        run: |
          curl -X GET https://vibestale3.vercel.app/api/cron/ai-analysis \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"